name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualite:
    name: Typecheck, lint et cliquet de baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Typecheck, lint et comparaison aux baselines
        run: bash scripts/ci-qualite.sh

      - name: Build de production
        run: npm run build
