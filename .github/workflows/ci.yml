name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualite:
    name: Typecheck, lint et cliquet de baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Typecheck, lint et comparaison aux baselines
        run: bash scripts/ci-qualite.sh

      - name: Tests unitaires (vitest)
        run: npm test

      - name: Build de production
        run: npm run build

  rls:
    name: Rejeu des migrations et tests RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Base jetable issue du rejeu (D-009 en attente) ; cliquet sur la
      # liste des echecs connus, supabase/tests/echecs-connus.txt.
      - name: Rejeu et tests RLS
        run: bash scripts/rejeu-migrations.sh --tests

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-rejeu-migrations
          path: test-results/rejeu-migrations.txt
          retention-days: 7

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: test-results/
          retention-days: 7
