name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualite:
    name: Typecheck, lint et cliquet de baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Typecheck, lint et comparaison aux baselines
        run: bash scripts/ci-qualite.sh

      - name: Tests unitaires (vitest)
        run: npm test

      - name: Build de production
        run: npm run build

      # Tests RLS (npm run test:rls) non branches : les migrations ne
      # rejouent pas encore sur une base vierge (voir D-008).

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: test-results/
          retention-days: 7
